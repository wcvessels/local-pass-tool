[package]
name = "localpass"
version = "1.0.0"
description = "Local-only cross-platform password generator"
authors = ["Will Vessels"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/wcvessels/local-pass-tool"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.3.3"
serde = { version = "=1.0.219", features = ["derive"] }
tauri = { version = "=2.11.5", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dbus",
  "macos-private-api",
  "wry",
  "x11",
] }
tauri-plugin-single-instance = "=2.4.2"
zeroize = { version = "=1.8.1", features = ["alloc"] }

# Native adapter crates belong only in their matching target section.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
